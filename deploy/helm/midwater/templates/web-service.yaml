{{- if .Values.web.enabled -}}
{{- $ctx := dict "root" . "component" "web" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "midwater.componentName" $ctx }}
  labels:
    {{- include "midwater.labels" . | nindent 4 }}
    {{- include "midwater.selectorLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector: {{- include "midwater.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
