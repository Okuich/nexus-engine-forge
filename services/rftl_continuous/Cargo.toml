[package]
name = "rftl_continuous"
version = "0.1.0"
edition = "2021"
description = "High-performance continuous simulation core for Midwater: Riemannian metric tensor fields, discrete Ricci curvature, and Caputo fractional advection-diffusion-deformation solver."
license = "Proprietary"

[lib]
name = "rftl_continuous"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
